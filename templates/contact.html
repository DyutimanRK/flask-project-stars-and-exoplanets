<html>
<head>
<title>Contact</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Contact</h1>

<div class="menu">
<a href="{{ url_for('home') }}">Home</a>
<a href="{{ url_for('stars') }}">Stars</a>
<a href="{{ url_for('exoplanets') }}">Exoplanets</a>
<a href="{{ url_for('interesting') }}">Interesting Objects</a>
<a href="{{ url_for('contact') }}">Contact</a>
</div>

<h2>Send a Message</h2>

<form method="POST" style="background-image:linear-gradient(rgba(5,5,34,0.65),rgba(5,5,34,0.65)),url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564');background-size:cover;background-position:center;color:white;">

Name:<br>
<input type="text" name="name" placeholder="Enter your name" required>

<br><br>

Message:<br>
<textarea name="message" rows="6" cols="40" placeholder="Write something about astronomy"></textarea>

<br><br>

<button type="submit">Send</button>

</form>

{% if message %}
<h2>{{ message }}</h2>
{% endif %}

</body>
</html>
